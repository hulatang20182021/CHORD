# Portable stage-by-stage Beauty example. The formal downstream runner uses
# configs/paper_k1024.env.
dataset: Beauty
seed: 42

paths:
  data_root: ./data
  output_root: ./results/chord
  model_path: ./models/Sentence-T5/sentence-t5-base

st5:
  batch_size: 32
  max_length: 256
  normalize: true
  device: cuda:0

legacy_cf:
  mode: legacy_biview
  window_size: 5
  svd_dim: 128
  ridge_alpha: 10.0
  random_state: 42

pls:
  shared_dim: 128
  private_dim: 64
  k1: 1024
  k2: 1024
  k3: 1024
